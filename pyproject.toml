[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-robot-simgen"
version = "0.1.0a1"
description = "Experimental template-based simulation scene packages with optional Cosmos video attachments."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Longtao Wu" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.0", "pytest>=8.0"]
sim = ["mujoco>=3.3; python_version >= '3.10'"]

[project.scripts]
cosmos-simgen = "cosmos_robot_simgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/cosmos_robot_simgen"]

[tool.coverage.report]
show_missing = true
fail_under = 80
